

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Imersos{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="navbar">
        <div class="container nav-content">
            <a href="{{ url_for('index') }}" class="logo">
                📖 Imersos
            </a>

            <nav class="nav-links">
                <a href="{{ url_for('index') }}"
                class="{{ 'active' if request.endpoint == 'index' else '' }}">
                    Início
                </a>
                <a href="{{ url_for('listar_livros') }}"
                class="{{ 'active' if request.endpoint in ['listar_livros', 'editar_livro'] else '' }}">
                    Acervo
                </a>
                <a href="{{ url_for('cadastrar_livro') }}"
                class="{{ 'active' if request.endpoint == 'cadastrar_livro' else '' }}">
                    Cadastrar
                </a>
            </nav>
        </div>
    </header>

    <main class="container main-content">

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alert {{ categoria }}">
                    {{ mensagem }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}
        {% endblock %}

    </main>
</body>
</html>
