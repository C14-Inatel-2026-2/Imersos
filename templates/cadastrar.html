{% extends "base.html" %}

{% block title %}Cadastrar - Imersos{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Cadastrar livro</h1>
        <p>Adicione uma nova obra ao seu acervo.</p>
    </div>
</div>

<section class="card form-card">

    {% if erro %}
        <div class="alert erro">{{ erro }}</div>
    {% endif %}

    <form action="{{ url_for('cadastrar_livro') }}"
          method="POST">

        <div class="field">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo"
                   class="form-control"
                   value="{{ request.form.get('titulo', '') }}"
                   required>
        </div>

        <div class="form-grid">
            <div class="field">
                <label for="autor">Autor</label>
                <input type="text" id="autor" name="autor"
                       class="form-control"
                       value="{{ request.form.get('autor', '') }}"
                       required>
            </div>

            <div class="field">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn"
                       class="form-control"
                       value="{{ request.form.get('isbn', '') }}"
                       required>
            </div>

            <div class="field">
                <label for="genero">Gênero</label>
                <input type="text" id="genero" name="genero"
                       class="form-control"
                       value="{{ request.form.get('genero', '') }}">
            </div>

            <div class="field">
                <label for="ano">Ano de publicação</label>
                <input type="number" id="ano" name="ano"
                       class="form-control" min="1"
                       value="{{ request.form.get('ano', '') }}"
                       required>
            </div>
        </div>

        <div class="field">
            <label for="status_leitura">Status de leitura</label>
            <select id="status_leitura"
                    name="status_leitura"
                    class="form-control">
                <option value="nao_iniciado">Não iniciado</option>
                <option value="lendo">Lendo</option>
                <option value="concluido">Concluído</option>
            </select>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('listar_livros') }}"
               class="btn btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn btn-primary">
                Cadastrar livro
            </button>
        </div>

    </form>
</section>

{% endblock %}
