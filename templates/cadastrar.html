<h1>Cadastrar Livro</h1>

<a href="{{ url_for('index') }}">Início</a>
<a href="{{ url_for('listar_livros') }}">Ver acervo</a>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

{% with mensagens = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensagem in mensagens %}
        <p class="{{ categoria }}">{{ mensagem }}</p>
    {% endfor %}
{% endwith %}

<form action="{{ url_for('cadastrar_livro') }}" method="POST">

    <label for="titulo">Título:</label>
    <input type="text" id="titulo" name="titulo" required>

    <label for="autor">Autor:</label>
    <input type="text" id="autor" name="autor" required>

    <label for="isbn">ISBN:</label>
    <input type="text" id="isbn" name="isbn" required>

    <label for="genero">Gênero:</label>
    <input type="text" id="genero" name="genero">

    <label for="ano">Ano de publicação:</label>
    <input type="number" id="ano" name="ano" min="1" required>

    <label for="status_leitura">Status de leitura:</label>
    <select id="status_leitura" name="status_leitura" required>
        <option value="nao_iniciado">Não iniciado</option>
        <option value="lendo">Lendo</option>
        <option value="concluido">Concluído</option>
    </select>

    <button type="submit">Cadastrar livro</button>

</form>
